<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volunteer Photo Hours</title>
<style>
  .hot-toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;
    background:#15212C;color:#fff;font:700 14px/1.4 system-ui,-apple-system,"Segoe UI","Ubuntu",sans-serif;
    padding:10px 16px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:min(560px,92vw)}
  .hot-toast.err{background:#9A3412}
</style>
</head>
<body>
<div id="app"></div>
<div class="hot-toast" id="hotToast" role="status" aria-live="polite" hidden></div>
<script>
/* Loader. It rarely needs to change.
   The app lives in app.html. This page loads it, then checks every couple of
   seconds whether app.html has changed on disk. When it has, the new version is
   swapped in and handed the photos already loaded (window.VPH), so nothing is
   read again. Photos never leave your computer. */
(() => {
  const SRC = 'app.html';
  const CHECK_MS = 2000;
  window.VPH = window.VPH || { photos: [], seen: new Set(), nextId: 1, thumbCache: new Map() };
  const shared = window.VPH;
  let version = null, busy = false, pending = false;

  const toastEl = document.getElementById('hotToast');
  let toastTimer = 0;
  function toast(msg, isErr) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('err', !!isErr);
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.hidden = true; }, isErr ? 8000 : 2500);
  }

  // Errors thrown by a freshly loaded version are shown instead of failing silently
  window.addEventListener('error', e => { if (version) toast('The updated app has an error: ' + e.message, true); });

  function mount(html) {
    const y = window.scrollY;
    if (shared.teardown) { try { shared.teardown(); } catch (e) { console.error(e); } }
    shared.teardown = null; shared.canReload = null;

    const doc = new DOMParser().parseFromString(html, 'text/html');
    document.querySelectorAll('style[data-app]').forEach(n => n.remove());
    for (const st of doc.querySelectorAll('style')) {
      const el = document.createElement('style');
      el.dataset.app = '';
      el.textContent = st.textContent;
      document.head.append(el);
    }
    const scripts = [...doc.body.querySelectorAll('script')];
    scripts.forEach(s => s.remove());
    const app = document.getElementById('app');
    app.replaceChildren(...[...doc.body.childNodes].map(n => document.importNode(n, true)));
    for (const s of scripts) {
      const el = document.createElement('script');
      el.textContent = s.textContent;
      app.append(el);          // runs now
    }
    requestAnimationFrame(() => window.scrollTo(0, y));
  }

  async function load(first) {
    const r = await fetch(SRC + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const html = await r.text();
    version = r.headers.get('ETag') || r.headers.get('Last-Modified') || String(html.length);
    mount(html);
    if (!first) toast('Updated to the latest version. Your loaded photos were kept.');
  }

  async function check() {
    if (busy || document.hidden) return;
    busy = true;
    try {
      const r = await fetch(SRC, { method: 'HEAD', cache: 'no-store' });
      const v = r.ok && (r.headers.get('ETag') || r.headers.get('Last-Modified'));
      if (v && version && v !== version) pending = true;
      if (pending) {
        const ready = !shared.canReload || shared.canReload();
        if (ready) { pending = false; await load(false); }
      }
    } catch (e) { /* server briefly unavailable; try again next time */ }
    busy = false;
  }

  load(true).then(() => setInterval(check, CHECK_MS)).catch(() => {
    document.getElementById('app').innerHTML =
      '<p style="font:16px/1.5 system-ui,sans-serif;max-width:40em;margin:40px auto;padding:0 20px">' +
      'Couldn’t load the app. Start it with <code>docker compose up -d</code> and open ' +
      '<a href="http://volunteers.localhost:8088/">http://volunteers.localhost:8088/</a>.</p>';
  });
})();
</script>
</body>
</html>
