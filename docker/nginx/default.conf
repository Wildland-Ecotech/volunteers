server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # The app: read-only
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # Saved data: the app reads and writes .json files here (./data on your computer)
    location ~ ^/data/(backups/)?[A-Za-z0-9_-][A-Za-z0-9._-]*\.json$ {
        root /srv;
        limit_except GET HEAD PUT { deny all; }

        dav_methods PUT;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;
        client_body_temp_path /srv/data/.tmp;
        client_max_body_size 50m;

        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    # Nothing else under /data/
    location /data/ {
        return 404;
    }
}
